    window.arCine = (function () {
      var v = null, st = 0, err = '', started = false, base = 'cine/';

        v.style.left = r.left + 'px'; v.style.top = r.top + 'px';
        v.style.width = r.width + 'px'; v.style.height = r.height + 'px';
      }
      function el() {
        if (v) return v;
        v = document.createElement('video');
        v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
        v.muted = true; v.defaultMuted = true; v.preload = 'auto';
        v.style.cssText = 'position:fixed;z-index:50;pointer-events:none;object-fit:contain;background:#000;display:none';
        document.body.appendChild(v);
        v.addEventListener('ended', function () { st = 3; });
        v.addEventListener('playing', function () { started = true; if (st !== 3) st = 1; });
        v.addEventListener('error', function () { if (v.getAttribute('src')) { st = 4; err = 'media'; } });
        window.addEventListener('resize', rect);
        return v;
      }
      return {
        play: function (name) {
          el(); st = 1; err = ''; started = false;
          v.style.display = 'block'; rect();
          v.src = base + name + '.mp4';
          var p = v.play();
          if (p && p.catch) p.catch(function (e) { err = String(e); v.muted = true;
              v.play().catch(function (e2) { st = 4; err = String(e2); }); });
        },
        toEnd: function () {
          if (!v) return;
          try { if (isFinite(v.duration) && v.duration > 0) { v.pause(); v.currentTime = Math.max(0, v.duration - 0.05); } } catch (e) {}
          st = 3;
        },
        stop: function () {
          if (!v) return;
          try { v.pause(); } catch (e) {}
          v.removeAttribute('src'); try { v.load(); } catch (e) {}
          v.style.display = 'none'; st = 0;
        },
